<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="A diff from single inference to autonomous loops: the model assists, the system executes">
  <title>From single inference to systemic execution</title>

  <defs>
    <clipPath id="typeReveal">
      <rect x="48" y="150" width="784" height="52">
        <animate attributeName="width" values="0;784;784;0" keyTimes="0;0.45;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="279" rx="14" fill="#0B1220" stroke="#1E2A3A"/>
  <line x1="1" y1="52" x2="879" y2="52" stroke="#1E2A3A"/>

  <circle cx="34" cy="27" r="4.5" fill="#2A3A4F"/>
  <circle cx="52" cy="27" r="4.5" fill="#2A3A4F"/>
  <circle cx="70" cy="27" r="4.5" fill="#2A3A4F"/>
  <text x="96" y="31" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">execution.diff</text>

  <rect x="48" y="90" width="784" height="46" rx="4" fill="#4FC3E8" opacity="0.06"/>
  <text x="66" y="120" fill="#4FC3E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">-</text>
  <text x="96" y="120" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">single inference</text>
  <text x="268" y="121" fill="#E6EDF6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">the model assists</text>

  <g clip-path="url(#typeReveal)">
    <rect x="48" y="150" width="784" height="46" rx="4" fill="#A78BFA" opacity="0.07"/>
    <text x="66" y="180" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">+</text>
    <text x="96" y="180" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">autonomous loops</text>
    <rect x="386" y="162" width="95" height="26" rx="3" fill="#F5A524" opacity="0.16"/>
    <text x="268" y="181" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">the system executes</text>
    <line x1="386" y1="192" x2="481" y2="192" stroke="#F5A524" stroke-width="1.5"/>
  </g>

  <rect x="490" y="164" width="9" height="23" fill="#F5A524">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.26;0.74;0.76" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <line x1="48" y1="228" x2="832" y2="228" stroke="#1E2A3A"/>
  <text x="48" y="252" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.8">SYSTEMIC EXECUTION BEATS RAW INTELLIGENCE</text>
</svg>
