<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Research system map: observe, understand, verify, operate">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>
  <rect width="920" height="200" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="34" text-anchor="middle" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Systems for memory, reliability, and decision intelligence</text>
  <text x="460" y="54" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">observe ’ understand ’ verify ’ operate</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c9d1d9">
    <rect x="28" y="78" width="188" height="88" rx="8" fill="#010409" stroke="#388bfd" stroke-width="1"/>
    <text x="122" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">OBSERVE</text>
    <text x="122" y="120" text-anchor="middle">market · code · EEG</text>
    <text x="122" y="136" text-anchor="middle">Slack · GitHub · AIS</text>
    <text x="122" y="152" text-anchor="middle" fill="#8b949e">raw signals</text>

    <path d="M 220 122 L 248 122" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/></marker></defs>

    <rect x="256" y="78" width="188" height="88" rx="8" fill="#010409" stroke="#388bfd" stroke-width="1"/>
    <text x="350" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">UNDERSTAND</text>
    <text x="350" y="120" text-anchor="middle">graphs · embeddings</text>
    <text x="350" y="136" text-anchor="middle">extraction · RAG</text>
    <text x="350" y="152" text-anchor="middle" fill="#8b949e">structured context</text>

    <path d="M 448 122 L 476 122" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="484" y="78" width="188" height="88" rx="8" fill="#010409" stroke="#388bfd" stroke-width="1"/>
    <text x="578" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">VERIFY</text>
    <text x="578" y="120" text-anchor="middle">benchmarks · probes</text>
    <text x="578" y="136" text-anchor="middle">failure injection</text>
    <text x="578" y="152" text-anchor="middle" fill="#8b949e">behavioral evidence</text>

    <path d="M 676 122 L 704 122" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="712" y="78" width="180" height="88" rx="8" fill="#010409" stroke="#388bfd" stroke-width="1"/>
    <text x="802" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">OPERATE</text>
    <text x="802" y="120" text-anchor="middle">agents · MCP · APIs</text>
    <text x="802" y="136" text-anchor="middle">products · dashboards</text>
    <text x="802" y="152" text-anchor="middle" fill="#8b949e">deployed systems</text>
